# ERP ICR + Logística (cotizador) + Finanzas en un VPS: base de datos PostgreSQL + dos APIs + HTTPS automático.
# Estructura esperada:  /opt/icr/servidor (esta carpeta) y /opt/icr/finanzas (al lado).
#   1) cp .env.example .env   y completa los valores
#   2) docker compose up -d --build
# Más detalles en DESPLIEGUE.md
name: icr

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cotizador
      POSTGRES_USER: icr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icr -d cotizador"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin "ports": la base solo se ve desde la API, nunca desde internet.

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://icr:${POSTGRES_PASSWORD}@db:5432/cotizador
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_CLAVE: ${ADMIN_CLAVE:?Falta ADMIN_CLAVE en el archivo .env}
      CLAVE_EDICION: ${CLAVE_EDICION:-1234}
      # Integraciones del ERP (Configuración › Integraciones). Opcionales.
      FINANZAS_API_URL: http://finanzas-api:8787
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODELO: ${OLLAMA_MODELO:-qwen3:4b}
      VRM_TOKEN: ${VRM_TOKEN:-}
      TZ: America/Lima
    volumes:
      - uploads:/app/uploads

  # Finanzas (caja diaria y caja chica). Usa la MISMA base y los MISMOS usuarios y sesiones que la API de arriba:
  # quien entra en la app entra aquí con el mismo usuario; su rol decide qué puede hacer.
  finanzas-api:
    build:
      context: ../finanzas
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://icr:${POSTGRES_PASSWORD}@db:5432/cotizador
      MAIN_API_URL: http://api:3000
      API_PREFIX: /api-caja
      UPLOAD_DIR: /data/fotos
      TZ: America/Lima
    volumes:
      - finanzas_fotos:/data/fotos

  # Finanzas 2 (versión de prueba para comparar con Finanzas 1): el MISMO código de API, pero con su PROPIA base de datos
  # («finanzas2», se crea sola), sus propias fotos y sus propias tablas. Los usuarios y las sesiones son los mismos de siempre
  # (AUTH_DATABASE_URL apunta a la base principal solo para validar quién es cada persona).
  finanzas2-api:
    build:
      context: ../finanzas
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      MODO: fin
      PORT: "8788"
      DATABASE_URL: postgres://icr:${POSTGRES_PASSWORD}@db:5432/finanzas2
      CREAR_BASE: "1"
      MIGRACIONES_DIR: /srv/db/migrations-fin
      AUTH_DATABASE_URL: postgres://icr:${POSTGRES_PASSWORD}@db:5432/cotizador
      MAIN_API_URL: http://api:3000
      API_PREFIX: /api-fin
      UPLOAD_DIR: /data/fotos
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TZ: America/Lima
    volumes:
      - finanzas2_fotos:/data/fotos
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8788/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - finanzas-api
      - finanzas2-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en el archivo .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - ./finanzas-web:/srv/finanzas:ro
      - ./finanzas2-web:/srv/finanzas2:ro
      - ./erp-web:/srv/erp:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  finanzas_fotos:
  finanzas2_fotos:
  caddy_data:
  caddy_config:
